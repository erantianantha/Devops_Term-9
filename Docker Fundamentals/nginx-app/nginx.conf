# Replaces the image's own /etc/nginx/conf.d/default.conf. Everything matching
# /etc/nginx/conf.d/*.conf is pulled in by the main nginx.conf, so dropping a
# file here is the whole mechanism - there is no "enable site" step like the
# sites-available / sites-enabled dance on a Debian install.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Deliberately =404 rather than the /index.html fallback used by the React
    # container next door. This server hosts static files, so a request for a
    # file that does not exist IS an error and should say so. Copying the SPA
    # fallback into a static site hides typos behind a 200.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Proof the custom config is the one in force: the stock image never sets
    # this header.
    add_header X-Served-By "nginx-container" always;
}
