<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World :: Apache</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #f4f1ea; color: #1f2124;
         font-family: "Segoe UI", system-ui, sans-serif; }
  .card { background: #fff; border: 1px solid #d9d3c7; border-radius: 10px;
          padding: 2rem 2.5rem; box-shadow: 0 10px 30px rgba(0,0,0,.07);
          max-width: 30rem; }
  h1 { margin: 0 0 .25rem; font-size: 2.4rem; letter-spacing: -.02em; }
  .stack { font-size: .8rem; text-transform: uppercase; letter-spacing: .12em;
           color: #c62d1f; font-weight: 700; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: .35rem 1rem;
       margin: 1.5rem 0 0; font-size: .9rem; }
  dt { color: #6b6b6b; }
  dd { margin: 0; font-family: Consolas, "Courier New", monospace; }
</style>
</head>
<body>
  <main class="card">
    <span class="stack">Apache HTTP Server</span>
    <h1>Hello World</h1>
    <p>No application code at all: a stock httpd image plus one file and one
       config snippet.</p>
    <dl>
      <dt>document root</dt><dd>/usr/local/apache2/htdocs</dd>
      <dt>container port</dt><dd>80</dd>
      <dt>published on</dt><dd>8081</dd>
      <dt>process model</dt><dd>httpd-foreground</dd>
    </dl>
  </main>
</body>
</html>
