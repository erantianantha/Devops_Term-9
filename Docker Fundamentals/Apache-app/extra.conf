# Dropped into conf/extra/ and pulled in from httpd.conf by the Dockerfile.
#
# Two reasons this file exists rather than just COPYing index.html:
#   1. ServerName silences the "Could not reliably determine the server's
#      fully qualified domain name" warning httpd prints on every start.
#   2. /health gives the check script something to hit that is not HTML, so a
#      readiness probe does not have to parse a page.

ServerName localhost

# mod_alias is already loaded in the stock image; this hands back a fixed body
# without touching the filesystem.
<Location "/health">
    SetHandler default-handler
</Location>

Alias "/health" "/usr/local/apache2/htdocs/health.txt"

# Cheap proof that this snippet was really loaded: the header shows up in
# curl -I and nowhere else.
Header always set X-Served-By "apache-container"
