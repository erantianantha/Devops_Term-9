server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets get a long cache because Vite fingerprints their names
    # (index-a1b2c3d4.js). A new build produces a new name, so a stale cache
    # can never serve the wrong file.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must NOT be cached, or a browser keeps loading the old
    # page which references assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The single-page-app fallback. React decides what /about means, but a
    # browser reloading on /about asks nginx for a file with that name first.
    # Without this line the answer is 404 and the app appears to break only on
    # refresh, which is a confusing way to find out.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
